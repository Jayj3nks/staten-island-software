<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Subtle ambient glow -->
  <circle cx="200" cy="180" r="280" fill="#1e3a8a" opacity="0.15" filter="blur(80px)" />
  <circle cx="1000" cy="450" r="320" fill="#0284c7" opacity="0.12" filter="blur(90px)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Logo Mark in Header -->
  <g transform="translate(80, 75)">
    <rect width="64" height="64" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
    <path d="M14 46 L20 18 L23 18 L25 46" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 46 L44 18 L41 18 L39 46" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 28 Q32 38 56 28" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M18 28 L23 28" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M41 28 L46 28" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M6 46 L58 46" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 35 L26 37 L28 39" stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M36 35 L38 37 L36 39" stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M33 33 L31 41" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <text x="84" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">STATEN ISLAND SOFTWARE</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="240" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    Software Engineering for Businesses
  </text>
  <text x="80" y="304" fill="url(#blueGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    That Need Things to Work
  </text>

  <!-- Tagline / Description -->
  <text x="80" y="380" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    Professional software engineering at practical, accessible pricing.
  </text>
  <text x="80" y="416" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    Custom websites, internal business tools, automations, and system integrations.
  </text>

  <!-- Badges / Service Area -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="310" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="23" r="5" fill="#10b981" />
    <text x="35" y="29" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">
      Staten Island • NYC • Remote
    </text>

    <rect x="330" y="0" width="310" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="350" y="29" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">
      Websites Starting at $349
    </text>

    <rect x="660" y="0" width="320" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="680" y="29" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">
      Independent Software Engineer
    </text>
  </g>
</svg>
